<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="kg" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="382">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>
  <!-- K 字标：竖干 + 两段斜臂（圆角端点） -->
  <g stroke="url(#kg)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 180 150 V 362"/>
    <path d="M 330 152 L 212 256 L 330 360"/>
  </g>
  <!-- 点缀：反编译「字节」高亮 -->
  <circle cx="394" cy="126" r="15" fill="#22D3EE"/>
  <circle cx="122" cy="388" r="9" fill="#22D3EE" opacity="0.75"/>
</svg>
