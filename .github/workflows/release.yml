name: Release

on:
  push:
    tags:
      - "v*.*.*"

    branches: [ "release-test/v*.*.*" ]

# additional permissions for provided GitHub token to create new release
permissions:
  contents: write

# ksmali（smali/baksmali 的 fork）只发布在 GitHub Packages 上，公开制品也要认证。
# 优先用仓库 secret GPR_KEY（read:packages 的 PAT），没有就退回工作流自带的 GITHUB_TOKEN
# （那需要先在 ksmali 的 package 设置里把本仓库加进 Actions 访问列表）。
env:
  GPR_USER: ${{ github.actor }}
  GPR_KEY: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}

jobs:
  build-release-win-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: oracle-actions/setup-java@v1
        with:
          release: 25


      - name: Set kadx version
        uses: actions/github-script@v9
        with:
          script: |
            const kadxVersion = context.ref.split('/').pop().substring(1)
            core.exportVariable('KADX_VERSION', kadxVersion);

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build No-JRE bundle
        run: ./gradlew dist -PkadxBundleType=win-no-jre

      - name: Save bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kadx-gui-{0}-win.zip', env.KADX_VERSION) }}
          path: ${{ format('build/distWin/kadx-gui-{0}-win.zip', env.KADX_VERSION) }}
          if-no-files-found: error
          retention-days: 1

      - name: Build JRE bundle
        run: ./gradlew dist -PbundleJRE=true -PkadxBundleType=win-jre

      - name: Save JRE bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kadx-gui-{0}-with-jre-win.zip', env.KADX_VERSION) }}
          path: ${{ format('build/distWinWithJre/kadx-gui-{0}-with-jre-win.zip', env.KADX_VERSION) }}
          if-no-files-found: error
          retention-days: 1

      # Prepare build for 'msi' bundle
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: |
          dotnet tool install wix --global --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix.exe --version

      - name: Build msi bundle
        run: ./gradlew :kadx-gui:jpackage -PkadxBundleType=msi

      - name: Save msi artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kadx-gui-{0}.msi', env.KADX_VERSION) }}
          path: kadx-gui/build/jpackage/kadx-gui-*.msi
          if-no-files-found: error
          retention-days: 1

  build-release-mac-bundle:
    strategy:
      matrix:
        os: [ macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set kadx version
        uses: actions/github-script@v9
        with:
          script: |
            const kadxVersion = context.ref.split('/').pop().substring(1)
            core.exportVariable('KADX_VERSION', kadxVersion);

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew distMac -PkadxBundleType=dmg

      - name: Save macOS DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kadx-gui-{0}-mac-{1}', env.KADX_VERSION, runner.arch) }}
          path: build/distMac/*.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [ build-release-win-bundle, build-release-mac-bundle ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set kadx version and release name
        uses: actions/github-script@v9
        with:
          script: |
            const kadxVersion = context.ref.split('/').pop().substring(1)
            core.exportVariable('KADX_VERSION', kadxVersion);

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew dist -PkadxBundleType=app
        env:
          KADX_BUILD_JAVA_VERSION: 11

      - name: Download Windows NO-JRE bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ format('kadx-gui-{0}-win.zip', env.KADX_VERSION) }}
          path: build

      - name: Download Windows JRE bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ format('kadx-gui-{0}-with-jre-win.zip', env.KADX_VERSION) }}
          path: build

      - name: Download Windows MSI bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ format('kadx-gui-{0}.msi', env.KADX_VERSION) }}
          path: build

      - name: Download macOS DMG bundles
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ format('kadx-gui-{0}-mac-*', env.KADX_VERSION) }}
          merge-multiple: true
          path: build

      - run: |
          cd build
          ls -l

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.KADX_VERSION }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            build/kadx-*.zip
            build/kadx-gui-*.msi
            build/kadx-gui-*-mac-*.dmg
