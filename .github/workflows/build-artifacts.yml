name: Build Artifacts

on:
  push:
    branches: [ master, build-test, build-artifacts ]

# ksmali（smali/baksmali 的 fork）只发布在 GitHub Packages 上。Maven 注册表不支持匿名拉取
# （公开制品也要认证），也不支持“给其它仓库开 Actions 访问”那种 granular 设置（只有
# container/npm/nuget/rubygems 有），所以 GITHUB_TOKEN 读不了别的仓库的 Maven 包 ——
# 必须用带 read:packages 的 classic PAT：仓库 secret GPR_KEY。
env:
  GPR_USER: ${{ github.actor }}
  GPR_KEY: ${{ secrets.GPR_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set kadx version
        run: |
          KADX_REV=$(git rev-list --count HEAD)
          KADX_VERSION="r${KADX_REV}.${GITHUB_SHA:0:7}"
          echo "KADX_VERSION=$KADX_VERSION" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew dist -PkadxBundleType=app
        env:
          KADX_BUILD_JAVA_VERSION: 11

      - name: Save bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kadx-{0}', env.KADX_VERSION) }}
          path: build/kadx-*.zip
          if-no-files-found: error
          retention-days: 14
          archive: false

  build-win-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: oracle-actions/setup-java@v1
        with:
          release: 25

      - name: Print Java version
        shell: bash
        run: java -version

      - name: Set kadx version
        shell: bash
        run: |
          KADX_REV=$(git rev-list --count HEAD)
          KADX_VERSION="r${KADX_REV}.${GITHUB_SHA:0:7}"
          echo "KADX_VERSION=$KADX_VERSION" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build NO-JRE bundle
        run: ./gradlew dist -PkadxBundleType=win-no-jre

      - name: Save Windows bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kadx-gui-{0}-no-jre-win', env.KADX_VERSION) }}
          path: build/distWin/kadx-gui-*.zip
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Build JRE bundle
        run: ./gradlew dist -PbundleJRE=true -PkadxBundleType=win-jre

      - name: Save JRE bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kadx-gui-{0}-with-jre-win', env.KADX_VERSION) }}
          path: build/distWinWithJre/kadx-gui-*.zip
          if-no-files-found: error
          retention-days: 14
          archive: false

      # Prepare build for 'msi' bundle
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: |
          dotnet tool install wix --global --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix.exe --version

      - name: Build msi bundle
        run: ./gradlew :kadx-gui:jpackage -PkadxBundleType=msi

      - name: Save msi artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kadx-gui-{0}.msi', env.KADX_VERSION) }}
          path: kadx-gui/build/jpackage/kadx-gui-*.msi
          if-no-files-found: error
          retention-days: 14
          # nightly.link support only '.zip' artifacts, issue: https://github.com/oprypin/nightly.link/issues/88
          # archive: false

  build-mac-bundle:
    strategy:
      matrix:
        os: [ macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set kadx version
        run: |
          KADX_REV=$(git rev-list --count HEAD)
          KADX_VERSION="r${KADX_REV}.${GITHUB_SHA:0:7}"
          echo "KADX_VERSION=$KADX_VERSION" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew distMac -PkadxBundleType=dmg

      - name: Save macOS DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kadx-gui-{0}-mac-{1}', env.KADX_VERSION, runner.arch) }}
          path: build/distMac/*.dmg
          if-no-files-found: error
          retention-days: 14
          # nightly.link support only '.zip' artifacts, issue: https://github.com/oprypin/nightly.link/issues/88
          # archive: false
