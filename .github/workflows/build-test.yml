name: Build Test

on:
  push:
    branches: [ master, build-test ]
  pull_request:
    branches: [ master ]

# ksmali（smali/baksmali 的 fork）只发布在 GitHub Packages 上。Maven 注册表不支持匿名拉取
# （公开制品也要认证），也不支持“给其它仓库开 Actions 访问”那种 granular 设置（只有
# container/npm/nuget/rubygems 有），所以 GITHUB_TOKEN 读不了别的仓库的 Maven 包 ——
# 必须用带 read:packages 的 classic PAT：仓库 secret GPR_KEY。
env:
  GPR_USER: ${{ github.actor }}
  GPR_KEY: ${{ secrets.GPR_KEY }}

jobs:
  tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build dist distWin
        env:
          KADX_BUILD_JAVA_VERSION: 11
