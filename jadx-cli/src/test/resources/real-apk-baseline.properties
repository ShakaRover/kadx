# 真实开源项目 APK 的反编译错误数基线（max allowed jadx error count）。
#
# 键 = APK 文件名（位于 JADX_REAL_APKS 指向的目录下）；值 = 允许的最大错误数。
# 只有在此文件里有条目的 APK 才会被 RealApkDecompileTest 检查；
# 修复问题后应下调此值（“错误数不得上升”看门狗）。
#
# 生成方式见仓库根目录 OSS_DECOMPILE_REPORT.md 与 tests/README.md。
# 当前基线来自 6 个真实开源项目的 release APK（R8 minify）+ Calculator debug（历史）。
# 注：这是 JadxDecompiler.getErrorsCount() 的值（CLI 日志里的 “finished with errors, count: N” 统计口径略有差异）。
# 残余错误集中在 R8 混淆后的 androidx.compose / kotlinx.coroutines 等库代码的
# RegionMaker 限制（与上游同步点 4e2b8d54 行为一致），应用自身业务代码无错误。
